[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# SPA fallback: files that exist on disk are served first; anything else
# (page GETs that are not a file) renders the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
