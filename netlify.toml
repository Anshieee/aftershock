[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ---------------------------------------------------------------------
# Routing: NO redirect/rewrite rules for function routes.
#
# Canonical dash paths = function filenames; Netlify cannot rewrite inside
# the reserved /.netlify/functions namespace (production-verified
# 2026-10-18) — a sub-path like /.netlify/functions/graph/probe resolves
# function name "graph", misses, and falls through to the SPA fallback,
# while the dash-named function path is served directly. The client
# (src/lib/api.ts, read-only reference) therefore calls the dash-named
# function files directly; unwired routes target unimplemented.mjs with
# query params. Guarded by tests/netlify/netlify-toml.test.mjs.
# ---------------------------------------------------------------------

# SPA fallback: files that exist on disk are served first; anything else
# (page GETs that are not a file) renders the app shell. MUST stay last.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
